[project]
name = "terraform-wars-backend"
version = "0.1.0"
description = "Backend for Terraform Wars - Terraform learning app"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "argon2-cffi>=25.1.0",
  "django>=6.0.0",
  "django-allauth[mfa,socialaccount,headless-spec]>=65.13.0",
  "django-cors-headers>=4.9.0",
  "django-json-widget>=2.1.0",
  "django-ninja==1.5.1",
  "django-storages[google]>=1.14.6",
  "django-unfold>=0.71.0",
  "google-api-python-client>=2.187.0",
  "google-auth>=2.43.0",
  "google-cloud-tasks>=2.20.0",
  "gunicorn>=23.0.0",
  "injector>=0.23.0",
  "msgspec>=0.20.0",
  "psycopg[binary]>=3.2.12",
  "python-decouple>=3.8",
  "sentry-sdk>=2.44.0",
]

[dependency-groups]
dev = [
  "django-silk>=5.4.3",
  "model-bakery>=1.20.5",
  "pre-commit>=4.4.0",
  "pytest-cov>=7.0.0",
  "pytest-django>=4.11.1",
  "pytest-mock>=3.15.1",
  "pytest-xdist>=3.8.0",
]

[tool.ruff]
lint.ignore = [
  "E501",
  "E731",
  "F405",
  "F841"
]
line-length = 120
target-version = "py314"

[tool.ruff.lint.pyflakes]
extend-generics = [
  "django.db.models.Manager",
  "django.db.models.QuerySet",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "main.settings.pytest"
