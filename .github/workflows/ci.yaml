name: Terraform Wars Backend CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: |
          uv sync
      - name: Run lint
        run: |
          uv run pre-commit run --all-files --verbose --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: terraform-wars
          POSTGRES_USER: terraform-wars
          POSTGRES_PASSWORD: terraform-wars
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U terraform-wars -d terraform-wars"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: |
          uv sync
      - name: Run tests
        run: |
          uv run manage.py makemigrations --dry-run --check
          uv run pytest --junitxml=junit/test-results.xml --cov=main --cov-report=xml --cov-report=html
        env:
          DJANGO_SETTINGS_MODULE: main.settings.pytest
          ENVIRONMENT: local
          SECRET_KEY: django-secret-key
          BASE_PROTOCOL: http
          BASE_DOMAIN: localhost
          DB_NAME: terraform-wars
          DB_USER: terraform-wars
          DB_PASSWORD: terraform-wars
          DB_HOST: localhost
          DB_PORT: ${{ job.services.postgres.ports[5432] }}
          SESSION_COOKIE_DOMAIN: localhost
          SESSION_COOKIE_SECURE: False
          CSRF_COOKIE_DOMAIN: localhost
          CSRF_COOKIE_SECURE: False
          CSRF_TRUSTED_ORIGINS: http://127.0.0.1:8080,http://localhost:8080,http://127.0.0.1:4200,http://localhost:4200
          CORS_ALLOWED_ORIGINS: http://127.0.0.1:8080,http://localhost:8080,http://127.0.0.1:4200,http://localhost:4200
          ALLOWED_HOSTS: localhost,127.0.0.1
          SECURE_SSL_REDIRECT: False
          INTERNAL_API_BASE_URL: http://localhost:8080
          GCP_PROJECT_ID: ''
          GCP_REGION: ''
          GCP_TASKS_TUTORIAL_SUBMISSION_QUEUE_ID: ''
          GCP_STORAGE_BUCKET_NAME: ''
          GCP_SERVICE_ACCOUNT_EMAIL: ''
          GCP_TERRAFORM_EXECUTOR_SERVICE_ACCOUNT_EMAIL: ''
          GCP_TERRAFORM_VALIDATOR_SERVICE_ACCOUNT_EMAIL: ''
          USE_CLOUD_STORAGE: False
          EMAIL_HOST: localhost
          EMAIL_HOST_USER: terraform-wars
          EMAIL_HOST_PASSWORD: terraform-wars
          EMAIL_PORT: 1025
          EMAIL_USE_TLS: False

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    needs: test
    if: github.event_name == 'push'
    env:
      IMAGE_URI: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_REPOSITORY }}/app-${{ github.ref == 'refs/heads/master' && 'production' || 'testing' }}:${{ github.sha }}
      WORKLOAD_IDENTITY_PROVIDER: "projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ vars.GCP_WIF_POOL_ID }}/providers/github"
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SA_ACCOUNT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker for Google Cloud
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ env.IMAGE_URI }} .
          docker push ${{ env.IMAGE_URI }}

  deploy-production:
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment:
      name: production
      url: https://api.app.terraformwars.com
    env:
      IMAGE_URI: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_REPOSITORY }}/app-production:${{ github.sha }}
      WORKLOAD_IDENTITY_PROVIDER: "projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ vars.GCP_WIF_POOL_ID }}/providers/github"
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SA_ACCOUNT }}

      - name: Deploy Backend Task Worker to Google Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.GCP_TASK_API_SERVICE }}
          image: ${{ env.IMAGE_URI }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION }}
          env_vars: |-
            DB_HOST=/cloudsql/terraform-wars-dev:europe-west3:terraform-wars-db
            CSRF_TRUSTED_ORIGINS="https://api.app.terraformwars.com\,https://www.api.app.terraformwars.com\,https://app.terraformwars.com\,https://terraform-wars-task-worker-production-436901077292.europe-west3.run.app"
            CORS_ALLOWED_ORIGINS="https://api.app.terraformwars.com\,https://www.api.app.terraformwars.com\,https://app.terraformwars.com\,https://terraform-wars-task-worker-production-436901077292.europe-west3.run.app"
            ALLOWED_HOSTS="localhost\,127.0.0.1\,api.app.terraformwars.com\,www.api.app.terraformwars.com\,terraform-wars-task-worker-production-436901077292.europe-west3.run.app"
            GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}
            GCP_REGION=${{ vars.GCP_REGION }}
          secrets: |-
            SECRET_KEY=TW_BE_SECRET_KEY:latest
            DB_PASSWORD=TW_BE_DB_PASSWORD:latest
            SENTRY_DSN=TW_BE_SENTRY_DSN:latest
            EMAIL_HOST_PASSWORD=TW_BE_EMAIL_HOST_PASSWORD:latest

      - name: Deploy Events Server to Google Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.GCP_EVENTS_API_SERVICE }}
          image: ${{ env.IMAGE_URI }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION }}
          env_vars: |-
            DJANGO_SETTINGS_MODULE=main.settings.production
            DB_HOST=/cloudsql/terraform-wars-dev:europe-west3:terraform-wars-db
            CSRF_TRUSTED_ORIGINS="https://api.app.terraformwars.com\,https://www.api.app.terraformwars.com\,https://app.terraformwars.com\,https://terraform-wars-task-worker-production-436901077292.europe-west3.run.app"
            CORS_ALLOWED_ORIGINS="https://api.app.terraformwars.com\,https://www.api.app.terraformwars.com\,https://app.terraformwars.com\,https://terraform-wars-task-worker-production-436901077292.europe-west3.run.app"
            ALLOWED_HOSTS="localhost\,127.0.0.1\,api.app.terraformwars.com\,www.api.app.terraformwars.com\,terraform-wars-task-worker-production-436901077292.europe-west3.run.app"
            GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}
            GCP_REGION=${{ vars.GCP_REGION }}
          secrets: |-
            SECRET_KEY=TW_BE_SECRET_KEY:latest
            DB_PASSWORD=TW_BE_DB_PASSWORD:latest
            SENTRY_DSN=TW_BE_SENTRY_DSN:latest
            EMAIL_HOST_PASSWORD=TW_BE_EMAIL_HOST_PASSWORD:latest

      - name: Deploy Backend Server to Google Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.GCP_API_SERVICE }}
          image: ${{ env.IMAGE_URI }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION }}
          env_vars: |-
            DJANGO_SETTINGS_MODULE=main.settings.production
            DB_HOST=/cloudsql/terraform-wars-dev:europe-west3:terraform-wars-db
            CSRF_TRUSTED_ORIGINS="https://api.app.terraformwars.com\,https://www.api.app.terraformwars.com\,https://app.terraformwars.com"
            CORS_ALLOWED_ORIGINS="https://api.app.terraformwars.com\,https://www.api.app.terraformwars.com\,https://app.terraformwars.com"
            ALLOWED_HOSTS="localhost\,127.0.0.1\,api.app.terraformwars.com\,www.api.app.terraformwars.com"
            GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}
            GCP_REGION=${{ vars.GCP_REGION }}
          secrets: |-
            SECRET_KEY=TW_BE_SECRET_KEY:latest
            DB_PASSWORD=TW_BE_DB_PASSWORD:latest
            SENTRY_DSN=TW_BE_SENTRY_DSN:latest
            EMAIL_HOST_PASSWORD=TW_BE_EMAIL_HOST_PASSWORD:latest

  sentry-release:
    runs-on: ubuntu-latest
    needs: deploy-production
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Create Sentry release
      uses: getsentry/action-release@v3
      env:
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
        SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      with:
        environment: production
        ignore_missing: true
